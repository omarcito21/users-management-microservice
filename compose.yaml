services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-crud_usuarios}
      MYSQL_USER: users_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password=$${MYSQL_ROOT_PASSWORD}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: users-management-api:local
    environment:
      PORT: "8080"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-crud_usuarios}
      DB_USERNAME: users_app
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      DB_SSL_MODE: DISABLED
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-brevo}
      BREVO_BASE_URL: ${BREVO_BASE_URL:-https://api.brevo.com}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_FROM_ADDRESS: ${BREVO_FROM_ADDRESS:-}
      BREVO_FROM_NAME: ${BREVO_FROM_NAME:-Gestion de Usuarios}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Gestion de Usuarios}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-900}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  mysql-data:
